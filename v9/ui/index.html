<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoCraft Game v9</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="topbar">
    <span class="brand">AutoCraft <b id="version"></b></span>
    <label>実験
      <select id="experiment"></select>
    </label>
    <label>seed
      <input id="seed" type="number" step="1" style="width:5em" />
    </label>
    <button id="btn-reset" title="この実験を最初から">↺ リセット</button>
    <button id="btn-play" title="Space">▶ 再生</button>
    <button id="btn-step">1 tick</button>
    <button id="btn-fit" title="表示を全体にフィット">⤢ フィット</button>
    <label>速度
      <input id="speed" type="range" min="1" max="240" />
      <span id="speed-val" class="mono"></span> tick/s
    </label>
    <span id="tick" class="mono">tick 0</span>
    <span id="exp-desc" class="desc"></span>
  </div>

  <div id="main">
    <div id="canvas-container">
      <div id="caption" class="caption-hidden"></div>
    </div>
    <aside id="side">
      <section id="metrics-section">
        <h3>メトリクス</h3>
        <div id="metrics"></div>
      </section>
      <section>
        <h3>選択</h3>
        <div id="selected"><em>個体や資源をクリックすると詳細が出ます</em></div>
      </section>
      <section id="legend">
        <h3>凡例</h3>
        <div id="legend-body"></div>
      </section>
      <section id="encoding-section">
        <h3>符号化表</h3>
        <div id="encoding-body"></div>
        <div class="hint">ドラッグで移動・ホイールで拡大縮小・クリックで選択</div>
      </section>
    </aside>
  </div>

  <script src="./simulation-ui-kit/lib/color.js"></script>
  <script src="./simulation-ui-kit/lib/sources.js"></script>
  <script src="./simulation-ui-kit/lib/shapes.js"></script>
  <script src="./simulation-ui-kit/lib/state-marks.js"></script>
  <script src="./simulation-ui-kit/lib/recipes.js"></script>
  <script src="./simulation-ui-kit/shapes.js"></script>
  <script src="./visual-language-model.js"></script>
  <script type="module" src="./main.ts"></script>
</body>
</html>
