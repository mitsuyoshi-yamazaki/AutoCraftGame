<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoCraft Game</title>
  <script type="module" crossorigin src="/assets/index-DxYS2Ffr.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/Geometry-Cu2IVdfD.js">
  <link rel="modulepreload" crossorigin href="/assets/RenderTargetSystem-CEbQ0DV7.js">
  <link rel="modulepreload" crossorigin href="/assets/getTextureBatchBindGroup-kcGKExq_.js">
  <link rel="modulepreload" crossorigin href="/assets/BufferResource-J_pl1HJD.js">
  <link rel="modulepreload" crossorigin href="/assets/ImageSource-CUlmfTXe.js">
  <link rel="stylesheet" crossorigin href="/assets/index-D00oUfEP.css">
</head>
<body>
  <!-- Control Bar -->
  <div id="controls">
    <button id="btn-play-pause" title="Space to toggle">▶</button>
    <label>
      tick/s:
      <button id="btn-speed-down">◀</button>
      <span id="speed-display">5</span>
      <button id="btn-speed-up">▶</button>
    </label>
    <span id="tick-display">Tick: 0</span>
  </div>

  <!-- Main Area -->
  <div id="main">
    <!-- Canvas -->
    <div id="canvas-container"></div>

    <!-- Side Panel -->
    <div id="side-panel">
      <!-- Stats -->
      <div id="stats" class="panel-section">
        <h3>Stats</h3>
        <div>Characters: <span id="stat-characters">0</span></div>
        <div>Births: <span id="stat-births">0</span></div>
        <div>Deaths: <span id="stat-deaths">0</span></div>
      </div>

      <!-- Selected Character -->
      <div id="selected" class="panel-section">
        <h3>Selected</h3>
        <div id="selected-content"><em>Click a character</em></div>
      </div>
    </div>
  </div>

  <!-- Event Log -->
  <div id="event-log" class="panel-section">
    <h3>Event Log</h3>
    <div id="event-log-content"></div>
  </div>

</body>
</html>
